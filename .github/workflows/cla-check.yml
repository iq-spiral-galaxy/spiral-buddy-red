name: CLA

# PR 본문의 CLA 동의 체크박스가 체크됐는지 확인 (경량 enforcement).
# 더 강한 서명 기록이 필요하면 CLA Assistant / EasyCLA GitHub App 도입 권장
# (서명자 DB·코멘트 서명을 자동 기록). 이 워크플로는 그 전 단계의 최소 게이트.
# release.yml과 무관 — pull_request에서만 동작.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  cla-checkbox:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CLA agreement checkbox is ticked
        env:
          BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          # 템플릿의 CLA 동의 항목: "- [x] ...CLA.md...동의" 형태를 찾는다.
          # 체크 표시는 [x] 또는 [X] 모두 허용.
          if printf '%s' "$BODY" | grep -qiE '^\s*-\s*\[x\].*CLA'; then
            echo "✓ CLA 동의 체크박스 확인됨"
            exit 0
          fi
          echo "::error::PR 본문에서 CLA 동의 체크박스가 체크되지 않았습니다."
          echo ""
          echo "PR 설명의 다음 항목을 [x]로 체크해주세요:"
          echo "  - [x] 기여자 라이선스 동의서(CLA.md)를 읽고 동의합니다 ..."
          echo "자세히: CONTRIBUTING.md / CLA.md"
          exit 1
